<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seguridad</title>
    <!-- Bootstrap para estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-dark bg-primary navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('inicio') }}">
                <i class="bi bi-shield-lock-fill me-2"></i> Sistema de Seguridad
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link {{ 'active' if request.endpoint=='inicio' else '' }}" href="{{ url_for('inicio') }}"><i class="bi bi-house-fill me-1"></i>Inicio</a>
                <a class="nav-link" href="{{ url_for('registrar') }}"><i class="bi bi-plus-circle-fill me-1"></i>Registrar</a>
                <a class="nav-link" href="{{ url_for('listar') }}"><i class="bi bi-list-ul-fill me-1"></i>Listar</a>
                <a class="nav-link" href="{{ url_for('consulta') }}"><i class="bi bi-search-fill me-1"></i>Consulta</a>
            </div>
        </div>
    </nav>

    <!-- Contenido de cada página -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    
    <script src="{{ url_for('static', filename='validaciones.js') }}" defer></script>
    <script src="{{ url_for('static', filename='funciones.js') }}" defer></script>
</body>
</html>
