{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">
    <i class="bi bi-list-ul"></i> Listar Eventos
</h2>

<div class="card shadow">
    <div class="card-body">
        {% if eventos %}
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Tipo de evento</th>
                        <th>Equipo</th>
                        <th>Nivel</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    {% for e in eventos %}
                    <tr>
                        <td>{{ e.codigo }}</td>
                        <td>{{ e.tipo }}</td>
                        <td>{{ e.equipo }}</td>
                        <td>
                            <span class="badge 
                                {% if e.nivel == 'Alto' %}bg-danger
                                {% elif e.nivel == 'Medio' %}bg-warning text-dark
                                {% else %}bg-success{% endif %}">
                                {{ e.nivel }}
                            </span>
                        </td>
                        <td>{{ e.estado }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="alert alert-info">
            No hay eventos registrados.
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
