{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-plus-circle"></i> Registrar Evento</h2>

<div class="card shadow">
    <div class="card-body">
        <form action="{{ url_for('registrar') }}" method="POST" onsubmit="return validarRegistro()">[cite: 5, 10]
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" name="codigo" id="codigo" class="form-control" required maxlength="10" placeholder="Ej: EVT001">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo de evento</label>
                    <input type="text" name="tipo" id="tipo" class="form-control" required placeholder="Ej: Acceso no autorizado">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Equipo</label>
                    <input type="text" name="equipo" id="equipo" class="form-control" required placeholder="Ej: LAB17-PC05">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Nivel de riesgo</label>
                    <select name="nivel" id="nivel" class="form-select" required>
                        <option value="">Seleccione...</option>
                        <option value="Bajo">Bajo</option>
                        <option value="Medio">Medio</option>
                        <option value="Alto">Alto</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Estado</label>
                    <select name="estado" id="estado" class="form-select" required>
                        <option value="Pendiente">Pendiente</option>
                        <option value="En análisis">En análisis</option>
                        <option value="Resuelto">Resuelto</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('inicio') }}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Cancelar
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Registrar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
